name: Sync from HackMD

on:
  schedule:
    - cron: "0 19 * * *"   # 每天台灣時間 03:00
  workflow_dispatch:        # 也可以在 GitHub 的 Actions 頁面手動執行
  push:
    branches: [main]
    paths: ["site/**", "scripts/**"]

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch notes from HackMD
        env:
          HACKMD_TOKEN: ${{ secrets.HACKMD_TOKEN }}
        run: python -I scripts/fetch.py
      - name: Build site
        run: python -I scripts/build.py
      - name: Commit changes
        run: |
          git config user.name "twps-sync-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content dist
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Sync from HackMD $(date -u +'%Y-%m-%d')"
            git push
          fi
